name: Build, Push, and Update Helm Charts

on:
  push:
    branches: [main]
    paths:
      - 'vote/**'          # adjust to your actual app source folders
      - 'result/**'
      - 'worker/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set short SHA as image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/votingapp-vote:${{ steps.vars.outputs.sha_short }}

      - name: Build and push result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/votingapp-result:${{ steps.vars.outputs.sha_short }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/votingapp-worker:${{ steps.vars.outputs.sha_short }}

      - name: Update Helm values.yaml with new image tags
        run: |
          sed -i "s|image: .*votingapp-vote.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/votingapp-vote:${{ steps.vars.outputs.sha_short }}|" votingapp/values.yaml
          sed -i "s|image: .*votingapp-result.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/votingapp-result:${{ steps.vars.outputs.sha_short }}|" votingapp/values.yaml
          sed -i "s|image: .*votingapp-worker.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/votingapp-worker:${{ steps.vars.outputs.sha_short }}|" votingapp/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add votingapp/values.yaml
          git commit -m "ci: update image tags to ${{ steps.vars.outputs.sha_short }}" || echo "No changes to commit"
          git push
